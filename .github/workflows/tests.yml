name: tests

on:
  push:
    branches: [master, main]
  pull_request:
  schedule:
    - cron: "0 18 * * *"   # 每日 02:00（北京时间）夜间冒烟
  workflow_dispatch:

jobs:
  test:
    name: 全量用例 + 覆盖率门槛
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 准备 .env（CI 使用占位值）
        run: cp .env.example .env

      - name: 运行测试并统计覆盖率
        run: |
          mkdir -p reports
          pytest -q \
            --cov=src --cov-report=term --cov-report=xml \
            --cov-fail-under=45 \
            --junitxml=reports/junit.xml \
            --html=reports/report.html --self-contained-html \
            --alluredir=reports/allure-results

      - name: 失败诊断（写入注解与 job summary）
        if: failure()
        run: |
          {
            echo "### 环境"
            python -V
            pip list 2>/dev/null | grep -Ei '^(pytest|pytest-cov|pytest-asyncio|pytest-mock|pytest-html|allure|fastapi|starlette|httpx|lxml|mcp|langgraph|langchain-core|chromadb|ragas|pydantic|openai|anthropic|tiktoken|numpy|rank-bm25)' || true
            echo ""
            echo "### junit.xml 中的失败用例"
            python - <<'PY' || true
          import xml.etree.ElementTree as ET
          root = ET.parse("reports/junit.xml").getroot()
          failed = []
          for tc in root.iter("testcase"):
              node = tc.find("failure")
              if node is None:
                  node = tc.find("error")
              if node is not None:
                  failed.append((tc, node))
          print(f"(失败用例数: {len(failed)})")
          for tc, node in failed:
              msg = (node.get("message") or "").strip().replace("\n", " ")
              print(f"- {tc.get('classname')}::{tc.get('name')} :: {msg[:150]}")
          if failed:
              tc, node = failed[0]
              print("\n### 首个失败详情")
              text = (node.text or "").strip()
              print("\n".join(text.splitlines()[-18:]))
          PY
            echo ""
            echo "### 覆盖率"
            python - <<'PY' || true
          import xml.etree.ElementTree as ET
          root = ET.parse("reports/coverage.xml").getroot()
          print("line-rate:", root.get("line-rate"))
          PY
          } > /tmp/diag.txt 2>&1
          echo '## 失败诊断' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/diag.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          msg=$(tr '\n' '|' < /tmp/diag.txt | cut -c1-2500)
          echo "::error title=CI诊断::$msg"

      - name: 归档测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/

  nightly-e2e:
    name: 夜间 e2e 冒烟
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 准备 .env（CI 使用占位值）
        run: cp .env.example .env

      - name: 运行 e2e 冒烟
        run: |
          mkdir -p reports
          pytest -m e2e -q \
            --junitxml=reports/e2e-junit.xml \
            --html=reports/e2e-report.html --self-contained-html

      - name: 归档 e2e 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports
          path: reports/
