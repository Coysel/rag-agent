name: tests

on:
  push:
    branches: [master, main]
  pull_request:
  schedule:
    - cron: "0 18 * * *"   # 每日 02:00（北京时间）夜间冒烟
  workflow_dispatch:

jobs:
  test:
    name: 全量用例 + 覆盖率门槛
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 准备 .env（CI 使用占位值）
        run: cp .env.example .env

      - name: 运行测试并统计覆盖率
        run: |
          mkdir -p reports
          pytest -q \
            --cov=src --cov-report=term --cov-report=xml \
            --cov-fail-under=45 \
            --junitxml=reports/junit.xml \
            --html=reports/report.html --self-contained-html \
            --alluredir=reports/allure-results

      - name: 归档测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/

  nightly-e2e:
    name: 夜间 e2e 冒烟
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 准备 .env（CI 使用占位值）
        run: cp .env.example .env

      - name: 运行 e2e 冒烟
        run: |
          mkdir -p reports
          pytest -m e2e -q \
            --junitxml=reports/e2e-junit.xml \
            --html=reports/e2e-report.html --self-contained-html

      - name: 归档 e2e 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports
          path: reports/
